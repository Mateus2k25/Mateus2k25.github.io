<html>
<head>
<title>QR Code</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
 <div class="mb-3">
  <label for="qrcode-texto" class="form-label">Conteúdo do QR Code</label>
  <input type="text" class="form-control" id="qrcode-texto">
 </div>
 <button class="btn btn-primary mb-3" id="gerar-qrcode">Gerar QR Code</button>
 <div id="qrcode"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
 document.getElementById("gerar-qrcode").onclick = function() {
   var texto = document.getElementById("qrcode-texto").value;
   document.getElementById("qrcode").innerHTML = "";

   new QRCode(document.getElementById("qrcode"), {
     text: texto,
     width: 128,
     height: 128,
     colorDark : "#000000",
     colorLight : "#ffffff",
     correctLevel : QRCode.CorrectLevel.H
   });
 };
</script>
</body>
</html>
