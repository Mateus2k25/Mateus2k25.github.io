<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse</title>
    <style>
        .com-efeito {
            background: blueviolet;
            color: white;
            border: 2px solid yellow
        }

        .com-efeito:hover {
            background: green;
            color: white;
            border: 2px dashed red;
        }

        .com-efeito:active {
            background: brown;
            color: orange;
            border: 2px solid gray;
        }
    </style>
</head>

<body>
    <button class="com-efeito">Botao</button>

</body>

</html>
