<html>

<head>
    <title>Cards</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="row mt-5">
            <div class="col-12 col-md-4 col-lg-4">
                <div class="card shadow">
                    <img src="https://descubraeua.com.br/wp-content/uploads/2020/06/manhattan-nova-york-1024x576.jpg"
                        class="card-img-top" alt="Parque da Criança" />
                    <div class="card-body">
                        <h5 class="card-title">Nova York</h5>
                        <p class="card-text">
                            Conheça Nova York
                        </p>
                        <a href="#" class="btn btn-primary">Ir ao link 1</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 col-lg-4">
                <div class="card shadow">
                    <img src="https://www.segueviagem.com.br/wp-content/uploads/2021/12/Estados-Unidos-Nova-York-shutterstock_248799484.jpg"
                        class="card-img-top" alt="Parque Temático" />
                    <div class="card-body">
                        <h5 class="card-title">Central Park</h5>
                        <p class="card-text">
                            Conheça Central Park
                        </p>
                        <a href="#" class="btn btn-primary">Ir ao link 2</a>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4 col-lg-4">
                <div class="card shadow">
                    <img src="https://www.remessaonline.com.br/blog/wp-content/uploads/2022/06/morar-em-nova-york.jpg"
                        class="card-img-top" alt="Pedalinhos" />
                    <div class="card-body">
                        <h5 class="card-title">Estatua da Liberdade</h5>
                        <p class="card-text">
                            Conheça Estatua da Liberdade
                        </p>
                        <a href="#" class="btn btn-primary">Ir ao link 3</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
